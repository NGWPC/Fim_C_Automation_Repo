stages:
  - build
  - test

job_build:
  stage: build
  script:
    - echo "Building the project"

job_test:
  stage: test
  variables:
    GIT_STRATEGY: none
  environment: test
  before_script:
    - echo "before script"
  script:
    - echo "Deploying FIMC to TEST..."
    - mkdir -p reports
    - cp  report.html reports   
    - echo "FIMC deployed to TEST"
  artifacts: 
    when: always
    paths:
       - reports/



