stages:
  - build
  - test

job_build:
  stage: build
  script:
    - echo "Building the project"

job_test:
  stage: test
  variables:
    GIT_STRATEGY: none
    CLONE_DIR: "~/pw/auto"
    GITLAB_REPO_URL: "https://gitlab.sh.nextgenwaterprediction.com/Jyoti.Mikkilineni/fim_c_automation.git"
    
  environment: test
  before_script:
    - echo $SSH_KEY
    - chmod 400 $SSH_KEY
    - ssh-agent
  script:
    - echo "Deploying FIMC to TEST..."
    - echo ~
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY jyoti.mikkilineni@10.203.106.253 "
     pip install pytest && pip install pytest-html && 
     pip install geopandas && rm -rf $CLONE_DIR && 
     mkdir -p $CLONE_DIR && 
     git clone -b $CI_COMMIT_REF_NAME --single-branch $GITLAB_REPO_URL $CLONE_DIR && 
     cd $CLONE_DIR && git checkout $CI_COMMIT_REF_NAME && 
     ~/.local/bin/pytest ~/pw/auto/scripts/tests -s && 
     git add report.html && git commit -m 'Adding report to the repo' && git push"   
    - echo "FIMC deployed to TEST"



